backend:
  name: github
  repo: homekew/fourrootsranch
  branch: main

site_url: https://www.fourrootsranch.com
display_url: https://www.fourrootsranch.com
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: pages
    label: Site Pages
    files:
      - label: Rehome
        name: rehome
        file: src/content/pages/rehome.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Donate
        name: donate
        file: src/content/pages/donate.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Community
        name: community
        file: src/content/pages/community.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Contact
        name: contact
        file: src/content/pages/contact.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Partner With Us
        name: partnerWithUs
        file: src/content/pages/partner-with-us.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Tours
        name: tours
        file: src/content/pages/tours.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Art
        name: art
        file: src/content/pages/art.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero kicker, name: heroKicker, widget: string, required: false }
          - { label: Hero summary, name: heroSummary, widget: text, required: false }
          - { label: CTA label, name: ctaLabel, widget: string, required: false }
          - { label: CTA href, name: ctaHref, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish date, name: publishDate, widget: datetime }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
  - name: settings
    label: Site Settings
    files:
      - label: Site settings
        name: siteSettings
        file: src/data/site-settings.json
        fields:
          - { label: Site name, name: siteName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Organization name, name: organizationName, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: EIN, name: ein, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Announcement, name: announcement, widget: text }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Footer navigation
            name: footerNav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Social links
            name: social
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Donation links
            name: donationLinks
            widget: object
            fields:
              - { label: PayPal, name: paypal, widget: string }
              - { label: Venmo, name: venmo, widget: string }
              - { label: Welcome Home, name: welcomeHome, widget: string }
          - label: Forms
            name: forms
            widget: object
            fields:
              - { label: Contact form endpoint, name: contact, widget: string }
              - { label: Rehome form endpoint, name: rehome, widget: string }
              - { label: Tour form endpoint, name: tour, widget: string }
          - { label: Shop URL, name: shopUrl, widget: string }
  - name: animals
    label: Animals
    files:
      - label: Animal groups
        name: animalGroups
        file: src/data/animals.json
        fields:
          - label: Entries
            name: entries
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Species, name: species, widget: string }
              - { label: Care focus, name: careFocus, widget: text }
              - { label: Story, name: story, widget: text }
              - label: Accent
                name: accent
                widget: select
                options: [sage, gold, clay]
  - name: faq
    label: FAQ
    files:
      - label: Questions
        name: faqEntries
        file: src/data/faqs.json
        fields:
          - label: Entries
            name: entries
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }
